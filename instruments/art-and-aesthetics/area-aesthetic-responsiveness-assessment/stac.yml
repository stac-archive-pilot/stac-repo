administration: "The AReA scale has three subscales measuring different aspects of
  aesthetic responsiveness. \n\nScale users should note that the original article
  has a scoring method where 1 item is included in 2 subscales, and this scoring approach
  is reflected in the files below:\n\nSchlotz, W., Wallot, S., Omigie, D., Masucci,
  M. D., Hoelzmann, S. C., & Vessel, E. A. (2021). The Aesthetic Responsiveness Assessment
  (AReA): A screening tool to assess individual differences in responsiveness to art
  in English and German. Psychology of Aesthetics, Creativity, and the Arts, 15(4),
  682–696. https://doi.org/10.1037/aca0000348\n\nOther psychometric research on the
  AReA scale suggests that the item can be assigned to one subscale exclusively:\n\nSilvia,
  P. J., Rodriguez-Boerwinkle, R. M., Awa, K. N., Zabelina, D. L., & Christensen,
  A. P. (2025). Evaluating the structure of the Aesthetic Responsiveness Assessment
  (AReA) with bootstrap exploratory graph analysis. Empirical Studies of the Arts,
  43(1), 550-564."
