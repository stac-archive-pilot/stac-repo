schema_version: 1
id: heiss-humor-efficacy-and-identity-short-scales
acronym: HEISS
title: Humor Efficacy and Identity Short Scales
section: creativity
subsection: self-report-scales
kind: scale
summary: These scales are grounded in Karwowski's research on creative self-concepts,
  which distinguishes between creative self-efficacy and creative personal identity.
  The HEISS measures these beliefs in the specific domain of humor via humor efficacy
  ("I can" beliefs related to being funny and making others laugh) and humor identity
  ("I am" beliefs related to the centrality of being funny to one's self-concept).
  This archive contains versions in English, Polish, and German. A Traditional Chinese
  version was recently developed by Chiang (2024) in a Master's thesis ("A Reliability
  and Validity Study on the Development of the Traditional Chinese Version Humor Efficacy
  and Identity Short Scales (HEISS-TC)").
