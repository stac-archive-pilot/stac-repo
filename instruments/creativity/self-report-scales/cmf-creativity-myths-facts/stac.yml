administration: "###Administration\n•\tAll 30 items are presented in randomized order\n•\tInstruction:
  Please indicate for each statement if you think it is right or wrong, or otherwise
  choose \"Don't know\",\n•\tResponse format: Correct, Incorrect, Don’t know\n###Scoring\n•\tEndorsement
  creativity myths = (#myths = agreed) + 0.5 * #(myths = don’t know)\n•\tEndorsement
  creativity facts = (#facts = agreed) + 0.5 * #(facts = don’t know)\n•\tCreativity
  knowledge = Endorsement creativity facts - Endorsement creativity myths"
