title: Sources of Creative Self-concept
section: creativity
subsection: self-report-scales
kind: scale
summary: 'It assesses experiences with Bandura''s four sources of information of self-efficacy.
  The scale comes in two flavors: - The main SoCSC includes six items per source and
  asks if specific experiences apply. - The SoCSC-V includes two items per sources
  and asks how often people have made positive and negative experiences with each
  source.'
