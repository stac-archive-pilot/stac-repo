summary: This folder contains materials related to the Motives for Creativity Scale
  (MoCS), a questionnaire measuring motives for engaging in creative behavior, each
  assessed with two items. The original MoCS included nine motives (Benedek et al.,
  2020). A tenth motive (passion) was introduced in later work (Benedek et al., 2025)
  and was found to be particularly relevant among creative professionals. Items are
  available in English and German.
