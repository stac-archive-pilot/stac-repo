kind: scale
summary: This scale is widely-used in creativity research and was first published
  by Karwowski et al. (2018). See below for additional references to consult regarding
  administration and scoring. Researchers interested in creative self-efficacy could
  consult the CSES (Creative Self-Efficacy Scale) elsewhere in the STAC archive.
