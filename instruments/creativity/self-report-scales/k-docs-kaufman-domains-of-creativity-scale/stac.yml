administration: |-
  This scale was first reported by Kaufman (2012):

  Kaufman, J. C. (2012). Counting the muses: Development of the Kaufman Domains of Creativity Scale (K-DOCS). Psychology of Aesthetics, Creativity, and the Arts, 6(4), 298–308. https://doi.org/10.1037/a0029751

  Researchers can find additional psychometric information about the scale in these articles:

  Acar, S., Cevik, E., Fesli, E., Bozkurt, R. N., & Kaufman, J. C. (2024). Testing the domain specificity of creativity with Kaufman Domains of Creativity Scale: A meta‐analytic confirmatory factor analysis. The Journal of Creative Behavior, 58(1), 171-189.

  Kapoor, H., Reiter-Palmon, R., & Kaufman, J. C. (2021). Norming the muses: Establishing the psychometric properties of the Kaufman Domains of Creativity Scale. Journal of Psychoeducational Assessment, 39(6), 680-693.

  McKay, A. S., Karwowski, M., & Kaufman, J. C. (2017). Measuring the muses: Validating the Kaufman Domains of Creativity Scale (K-DOCS). Psychology of Aesthetics, Creativity, and the Arts, 11(2), 216–230. https://doi.org/10.1037/aca0000074
