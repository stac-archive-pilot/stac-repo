summary: The AQT is a divergent thinking task designed to measure creative question
  generation. Instead of asking participants to generate alternative uses (as in the
  traditional AUT), the AQT requires participants to produce creative and unusual
  questions about everyday objects within a fixed time window. The task is rated for
  multiple dimensions of creativity, including **fluency** and **originality** as
  well as **question complexity**. It has been used in recent work examining creative
  cognition, question-asking, and the structure of semantic memory.
