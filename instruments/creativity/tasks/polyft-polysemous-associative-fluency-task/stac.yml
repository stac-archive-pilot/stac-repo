acronym: PolyFT
title: Polysemous Associative Fluency Task
section: creativity
subsection: tasks
kind: task
summary: 'The POLYFT_IDGRP folder contains files related to PolyFT. PolyFT is an associative
  fluency task that uses polysemous words as cues for a free-associative memory search.
  It enables examination of clustering and switching among different meanings, and
  investigates how individuals search their memory, alternating between exploration
  and exploitation, and combining associative and controlled processes. These memory
  search processes are particularly relevant to idea generation. In the PolyFT task,
  participants are required to list all the words they can think of associated with
  a given cue word (i.e., single-word associations) within 1,5 minutes (computerized
  version). As cue words, we selected ambiguous, polysemous French words with high
  lexical frequency (> 20 occurrences per million in a large corpus, according to
  the French lexicon project, http://www.lexique.org/) and at least three distinct
  meanings, according to the French dictionary (Supplementary Table 1). The list of
  meanings for each cue was compiled using a French linguistic research resource (Centre
  National de Ressources Textuelles et Lexicales; https://www.cnrtl.fr/). For each
  cue word, participants generated words associated with the cue word, without being
  informed that the words had different meanings. Contact: emmavolle@gmail.com'
