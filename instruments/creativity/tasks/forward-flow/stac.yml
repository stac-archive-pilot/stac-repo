id: forward-flow
acronym: null
title: Forward Flow
section: creativity
subsection: tasks
kind: task
summary: Fward Floorw is a Chained Free Association Task, where participants generate
  chained associates (I.e., a word that comes to mind as related to a previous word)
  from a specific cue word. Computational semantic spaces are used to compute the
  semantic distance between each pair of words. The average over these scores is the
  measure Forward Flow, which empirically quantifies he breadth of associative search
  of a person. This measure has been shown to be significantly related to divergent
  thinking.
