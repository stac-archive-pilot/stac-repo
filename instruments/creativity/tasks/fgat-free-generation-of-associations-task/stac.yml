acronym: FGAT
title: Free Generation of Associations Task
section: creativity
subsection: tasks
kind: task
summary: 'The FGAT_Matlab folder contains files and folders related to FGAT, a Free
  Generation of Associations Task. FGAT is a word association task, previously shown
  to capture remote thinking. It is composed of two conditions, presented successively,
  always in the same order. FGAT-first condition After a short training session, participants
  perform the 62 trials of the first condition block (hereafter referred to as FGAT-first).
  They are presented with a cue word and instructed to provide the first word that
  comes to mind after reading the cue word. They have 10 seconds to find a word and
  press the spacebar. This condition is used to explore the participants’ spontaneous
  semantic associations. FGAT-distant condition In a different following block, participants
  are administered 62 trials of the second condition of the task (hereafter referred
  to as FGAT-distant). On each trial, they are presented with a cue word as in the
  previous condition and instructed to press the spacebar once they have thought of
  a word unusually associated with the cue. They are asked to find a distant but understandable
  associate and to think creatively. They have 20 seconds to think of a word and press
  the spacebar. This condition is used to assess participants’ ability to intentionally
  produce remote and creative associations. The material: Both conditions use the
  same list of 62 cue words, presented randomly across each condition. Cue words are
  nouns, with a lexical frequency (http://www.lexique.org/) above 15 occurrences per
  million and a number of syllables lower than four. Half of the cues are considered
  as steep (with a strongly dominant associate) and the other half flat (more balanced
  strength with its associates). Cues vary in terms of steepness from 1.03 to 24.07.
  Contact: emmavolle@gmail.com'
