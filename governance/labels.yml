# STAC label set
#
# Single source of truth for repository labels. The workflow
# .github/workflows/labels-sync.yml applies this file to the repository on
# every push to main that changes it (format: EndBug/label-sync).
#
# Conventions
# - Prefix "group:" so labels sort and filter well (type:, section:, lang:, ...).
# - Colors are hex without "#". One color family per prefix.
# - Labels referenced by issue forms, workflows, .github/labeler.yml and
#   .github/dependabot.yml MUST exist here, otherwise GitHub silently drops them.
# - "aliases" renames an existing label instead of creating a new one.

# ---------------------------------------------------------------- type:
- name: "type:new-instrument"
  color: "1f6feb"
  description: "Proposal to add a new scale, task or method"
- name: "type:language-version"
